name: Published download check

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to verify against the website and signed release record
        required: true
        default: '0.2.19'

permissions:
  contents: read

jobs:
  download:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install signature verification library
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cryptography==48.0.1
      - name: Verify installer, website metadata and the production updater download
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B tools/check_release_download.py --version "$env:RELEASE_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
